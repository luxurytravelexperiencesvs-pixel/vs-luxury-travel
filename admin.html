<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Luxury Travel — Administración</title>
    <style>

    body {
        margin: 0;
        min-height: 100vh;
        background: #050505;
        color: #ffffff;
        font-family: "Montserrat", sans-serif;
    }
    h1,
    h2 {
        font-family: "Cormorant Garamond", serif;
        font-weight: 500;
    }

    h1 {
        font-size: 42px;
        letter-spacing: 2px;
        color: #d4af37;
        text-align: center;
        margin: 0 0 8px;
    }

    h2 {
        font-size: 34px;
        color: #d4af37;
        margin-bottom: 30px;
    }

    #requests-container {
    display: grid;
    gap: 22px;
}

#requests-container > div {
    padding: 30px;
    background: #111111;
    border: 1px solid rgba(212, 175, 55, 0.22);
    border-radius: 6px;
    box-sizing: border-box;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.30);
}

#requests-container h3 {
    margin: 0 0 22px;
    color: #d4af37;
    font-family: "Cormorant Garamond", serif;
    font-size: 30px;
    font-weight: 500;
}

#requests-container p {
    margin: 8px 0;
    color: #c8c8c8;
    font-size: 14px;
    line-height: 1.6;
}

#requests-container strong {
    color: #ffffff;
}

#logout-button {
    display: block;
    margin: 0 0 35px auto;
    padding: 11px 22px;
    background: transparent;
    color: #d4af37;
    border: 1px solid rgba(212, 175, 55, 0.45);
    border-radius: 3px;
    font-family: "Montserrat", sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
}

#logout-button:hover {
    background: #d4af37;
    color: #050505;
}
    </style>
</head>

<body>

    <div id="login-section">

        <h1>VS Luxury Travel</h1>

        <p>Panel de administración</p>

        <form id="login-form">

            <label for="admin-email">Correo electrónico</label>
            <input
                type="email"
                id="admin-email"
                required
            >

            <label for="admin-password">Contraseña</label>
            <input
                type="password"
                id="admin-password"
                required
            >

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

        <p id="login-message"></p>

    </div>
    <div id="admin-dashboard" style="display: none; max-width: 1200px; margin: 0 auto; padding: 60px 25px;">

    <button id="logout-button">
        Cerrar sesión
    </button>

    <h2>Solicitudes de clientes</h2>

    <div id="requests-container"></div>

    </div>

    <h2>Solicitudes de clientes</h2>

    <div id="requests-container"></div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin.js"></script>

</body>
</html>
